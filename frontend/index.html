<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Head por perfil (spec `public-seo`, change `add-server-rendered-head`).
      En producción Caddy procesa este archivo con `templates`; sus acciones son
      los comentarios que empiezan con numeral. Pide el fragmento del perfil a la
      API y, si llega, lo emite en lugar del fallback de abajo, de modo que nunca
      hay dos etiquetas por clave. Si la API no responde, entrega el fallback. En
      desarrollo, sin Caddy, estas líneas son comentarios y vale el fallback; el
      cliente escribe los metadatos del perfil al resolverlo, como siempre.
    -->
    <!--# $slug := default "all" (trimPrefix "/" .OriginalReq.URL.Path) -->
    <!--# $head := httpInclude (printf "/api/public/profile-head?slug=%s&lang=%s" (urlquery $slug) (urlquery (.OriginalReq.URL.Query.Get "lang"))) -->
    <!--# if $head --><!--# $head --><!--# else -->
    <title>Manuel Saavedra · Portafolio profesional</title>
    <meta
      name="description"
      content="Portafolio profesional de Manuel Saavedra: experiencia, skills y perfiles curados por rol."
    />
    <meta property="og:type" content="profile" />
    <meta property="og:site_name" content="Manuel Saavedra · Portafolio profesional" />
    <meta property="og:title" content="Manuel Saavedra · Portafolio profesional" />
    <meta
      property="og:description"
      content="Portafolio profesional de Manuel Saavedra: experiencia, skills y perfiles curados por rol."
    />
    <!--# printf "<meta property=\"og:image\" content=\"https://%s/og-default.png\" />" .Host -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Manuel Saavedra — portafolio profesional" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Manuel Saavedra · Portafolio profesional" />
    <meta
      name="twitter:description"
      content="Portafolio profesional de Manuel Saavedra: experiencia, skills y perfiles curados por rol."
    />
    <!--# end -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      Inter es la tipografía del default y de cuatro de los cinco presets. Se sirve desde el propio
      origen (`@font-face` en themes/theme.css, D6 de `improve-mobile-performance`); el preload
      lleva `crossorigin` porque las fuentes se piden siempre en modo CORS. Las demás familias se
      siguen pidiendo a Google Fonts desde themes/fonts.ts cuando un tema las usa.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-v20.woff2"
      crossorigin
    />
    <!--
      Pide el perfil mientras se descarga el bundle (D5 de `improve-mobile-performance`): script
      clásico del propio origen, sin módulos, sin inline. La app toma la respuesta una sola vez.
    -->
    <script src="/profile-prefetch.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
