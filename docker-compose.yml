# Docker Compose — Entorno local del Portafolio
# Levanta PostgreSQL y Adminer (UI ligera para inspeccionar la DB).
#
# Uso:
#   docker compose up -d        # levantar en background
#   docker compose down         # detener
#   docker compose down -v      # detener y borrar el volumen (reset total)
#
# Puertos: configurables para convivir con otros proyectos en la misma máquina.
#   POSTGRES_PORT (por defecto 5434) y ADMINER_PORT (por defecto 8080).
#   El 5432 suele estar tomado por otro Postgres local, así que el valor por
#   defecto NO es 5432 a propósito.
#
# DATABASE_URL para el backend (.env):
#   DATABASE_URL="postgresql://portfolio:portfolio@localhost:5434/portfolio?schema=public"
#
# Para usar otro puerto, sin editar este archivo:
#   POSTGRES_PORT=5555 docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: portfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - portfolio-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: portfolio-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres

volumes:
  portfolio-pgdata:
    name: portfolio-pgdata
